services:
  app:
    build:
      context: ./services/app
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: climbing_judge_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./services/app:/var/www/html
      - ./.env:/var/www/html/.env
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-climbing_judge}
      DB_USERNAME: ${DB_USERNAME:-climbing}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SESSION_DRIVER: database
      CACHE_STORE: file
      FILESYSTEM_DISK: public
      AI_SERVICE_URL: http://ai-service:8000/analyze
      AI_STATUS_URL: http://ai-service:8000/status
      AI_SERVICE_TIMEOUT: ${AI_SERVICE_TIMEOUT:-330}
    networks:
      - climbing-network

  db:
    image: mariadb:11.4
    container_name: climbing_judge_db
    restart: unless-stopped
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-climbing_judge}
      MARIADB_USER: ${DB_USERNAME:-climbing}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - dbdata:/var/lib/mysql
      - ./services/db/initdb:/docker-entrypoint-initdb.d:ro
      - ./services/db/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - climbing-network

  ai-service:
    build:
      context: ./services/ai-service
    container_name: climbing_judge_ai_service
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    volumes:
      - ./.env:/app/project.env:ro
    environment:
      DYNAMIC_ENV_FILE: /app/project.env
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      AI_MODEL: ${AI_MODEL:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-vl:4b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-300}
    networks:
      - climbing-network

  ollama:
    image: ollama/ollama:latest
    container_name: climbing_judge_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    networks:
      - climbing-network

volumes:
  dbdata:
  ollama_data:

networks:
  climbing-network:
